<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuários</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --tx:#1d2733; --mut:#5d6b7a; --pri:#1f6feb; --ok:#1a7f37; --err:#b42318; --bd:#d8dee4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12171d; --card:#1b222b; --tx:#e6edf3; --mut:#9aa7b4; --pri:#4c8dff; --ok:#3fb950; --err:#f85149; --bd:#2f3a46; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui,Segoe UI,sans-serif; }
  .top { display:flex; gap:14px; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--bd); flex-wrap:wrap; }
  .top .sp { flex:1; }
  .top a, .top button.link { color:var(--pri); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; padding:0; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 16px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; align-items:end; }
  label { display:block; font-size:13px; color:var(--mut); margin-bottom:4px; }
  input, select { width:100%; padding:9px 11px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--tx); font:inherit; }
  button { background:var(--pri); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; }
  button.sec { background:transparent; color:var(--tx); border:1px solid var(--bd); }
  button.del { background:transparent; color:var(--err); border:1px solid var(--bd); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--bd); vertical-align:middle; }
  th { font-size:13px; color:var(--mut); font-weight:600; }
  td.acts { display:flex; gap:6px; flex-wrap:wrap; }
  .msg { margin:10px 0 0; min-height:1.4em; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--bd); color:var(--mut); }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<div class="top">
  <strong>Ajuste de Planilhas de Entradas</strong>
  <a href="/">Planilhas</a>
  <a href="/admin"><b>Usuários</b></a>
  <span class="sp"></span>
  <span id="quem" class="tag"></span>
  <button class="link" id="sair">Sair</button>
</div>
<main>
  <h1>Usuários</h1>

  <div class="card">
    <h2>Novo usuário</h2>
    <form id="novo" class="grid" autocomplete="off">
      <div><label for="nu">Usuário</label><input id="nu" required></div>
      <div><label for="ns">Senha (mín. 6)</label><input id="ns" type="password" autocomplete="new-password" required></div>
      <div><label for="np">Perfil</label>
        <select id="np"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select></div>
      <div><button>Cadastrar</button></div>
    </form>
    <p class="msg" id="msg" role="status"></p>
  </div>

  <div class="card scroll">
    <table>
      <thead><tr><th>Usuário</th><th>Perfil</th><th>Situação</th><th>Ações</th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let eu = '';

function msg(t, ok) { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); }

async function api(url, method, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/login.html'; throw new Error('401'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || 'Erro');
  return d;
}

async function carregar() {
  const lista = await api('/api/usuarios', 'GET');
  $('lista').innerHTML = lista.map((u) => {
    const meu = u.usuario.toLowerCase() === eu.toLowerCase();
    return '<tr><td>' + esc(u.usuario) + (meu ? ' <span class="tag">você</span>' : '') + '</td>'
      + '<td>' + (u.perfil === 'admin' ? 'Administrador' : 'Usuário') + '</td>'
      + '<td>' + (u.ativo ? 'Ativo' : 'Desativado') + '</td>'
      + '<td class="acts"><button class="sec" data-a="senha" data-u="' + esc(u.usuario) + '">Nova senha</button>'
      + (meu ? '' : '<button class="sec" data-a="ativo" data-v="' + (u.ativo ? 0 : 1) + '" data-u="' + esc(u.usuario) + '">' + (u.ativo ? 'Desativar' : 'Ativar') + '</button>'
        + '<button class="del" data-a="excluir" data-u="' + esc(u.usuario) + '">Excluir</button>')
      + '</td></tr>';
  }).join('');
}

$('lista').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const u = b.dataset.u, enc = encodeURIComponent(u);
  try {
    if (b.dataset.a === 'senha') {
      const s = prompt('Nova senha para "' + u + '" (mín. 6 caracteres):');
      if (s == null) return;
      await api('/api/usuarios/' + enc, 'PATCH', { senha: s }); msg('Senha de "' + u + '" alterada.', true);
    } else if (b.dataset.a === 'ativo') {
      await api('/api/usuarios/' + enc, 'PATCH', { ativo: b.dataset.v === '1' }); msg('Situação de "' + u + '" atualizada.', true);
    } else if (b.dataset.a === 'excluir') {
      if (!confirm('Excluir o usuário "' + u + '"?')) return;
      await api('/api/usuarios/' + enc, 'DELETE'); msg('Usuário "' + u + '" excluído.', true);
    }
    await carregar();
  } catch (x) { if (x.message !== '401') msg(x.message, false); }
};

$('novo').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/usuarios', 'POST', { usuario: $('nu').value.trim(), senha: $('ns').value, perfil: $('np').value });
    msg('Usuário "' + $('nu').value.trim() + '" cadastrado.', true); $('novo').reset(); await carregar();
  } catch (x) { if (x.message !== '401') msg(x.message, false); }
};

$('sair').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login.html'; };

(async () => {
  try { eu = (await api('/api/me', 'GET')).usuario; $('quem').textContent = eu; await carregar(); } catch (x) { /* redireciona */ }
})();
</script>
</body>
</html>

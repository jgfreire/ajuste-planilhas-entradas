<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --tx:#1d2733; --mut:#5d6b7a; --pri:#1f6feb; --err:#b42318; --bd:#d8dee4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12171d; --card:#1b222b; --tx:#e6edf3; --mut:#9aa7b4; --pri:#4c8dff; --err:#f85149; --bd:#2f3a46; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui,Segoe UI,sans-serif; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 18px; color:var(--mut); }
  label { display:block; margin:12px 0 4px; font-size:13px; color:var(--mut); }
  input { width:100%; padding:10px 12px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--tx); font:inherit; }
  input:focus { outline:2px solid var(--pri); outline-offset:-1px; }
  button { width:100%; margin-top:18px; background:var(--pri); color:#fff; border:0; border-radius:8px; padding:11px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--err); min-height:1.4em; margin:12px 0 0; font-size:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Ajuste de Planilhas de Entradas</h1>
  <p class="sub">Entre para continuar.</p>
  <div id="s1">
    <label for="usuario">Usuário</label>
    <input id="usuario" autocomplete="username" autofocus required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
  </div>
  <div id="s2" hidden>
    <label for="codigo">Código de verificação</label>
    <input id="codigo" type="password" autocomplete="one-time-code">
  </div>
  <p class="err" id="err" role="alert"></p>
  <button id="btn">Entrar</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
let pendente = null;

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return { ok: r.ok, d: await r.json().catch(() => ({})) };
}
function voltar(msg) {
  pendente = null; $('s1').hidden = false; $('s2').hidden = true; $('codigo').required = false; $('codigo').value = '';
  $('senha').value = ''; $('err').textContent = msg || ''; $('usuario').focus();
}

$('f').onsubmit = async (e) => {
  e.preventDefault(); $('err').textContent = ''; $('btn').disabled = true;
  try {
    if (!pendente) {
      const { ok, d } = await post('/api/login', { usuario: $('usuario').value.trim(), senha: $('senha').value });
      if (!ok) { $('err').textContent = d.erro || 'Não foi possível entrar.'; $('senha').value = ''; }
      else if (d.etapa === 2) {
        pendente = d.pendente; $('s1').hidden = true; $('s2').hidden = false; $('codigo').required = true; $('codigo').focus();
      } else location.href = '/';
    } else {
      const { ok, d } = await post('/api/login/verificar', { pendente, codigo: $('codigo').value });
      if (ok) location.href = '/';
      else if (d.reiniciar) voltar(d.erro);
      else { $('err').textContent = d.erro || 'Código inválido.'; $('codigo').value = ''; $('codigo').focus(); }
    }
  } catch (x) { $('err').textContent = 'Falha de conexão com o servidor.'; }
  $('btn').disabled = false;
};
</script>
</body>
</html>
